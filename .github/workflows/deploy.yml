name: Deploy

on:
  push:
    branches:
      - main
      - stage
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-staging:
    needs: build-and-push
    if: github.ref == 'refs/heads/stage'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            cd /opt/tg/tg-deploy
            echo "$GHCR_TOKEN" | docker login ghcr.io -u mikrowelt --password-stdin
            docker pull ghcr.io/mikrowelt/dialog-gen:stage
            docker compose up -d dialog-gen
            sleep 5
            docker compose ps dialog-gen
            docker compose logs dialog-gen --tail=10
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  deploy-production:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            cd /opt/tg/tg-deploy
            echo "$GHCR_TOKEN" | docker login ghcr.io -u mikrowelt --password-stdin
            docker pull ghcr.io/mikrowelt/dialog-gen:main
            docker compose up -d dialog-gen
            sleep 5
            docker compose ps dialog-gen
            docker compose logs dialog-gen --tail=10
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
