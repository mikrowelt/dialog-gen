name: Deploy

on:
  push:
    branches:
      - main
      - stage
  workflow_dispatch:

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/stage'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Clone repo if not exists
            if [ ! -d /opt/tg/dialog-gen ]; then
              cd /opt/tg && git clone https://github.com/mikrowelt/dialog-gen.git
              cd dialog-gen && git checkout stage
            else
              cd /opt/tg/dialog-gen && git fetch origin && git checkout stage && git pull origin stage
            fi

            # Ensure Ollama is running and has the model
            cd /opt/tg/tg-deploy
            docker compose up -d ollama
            sleep 5
            docker compose exec -T ollama ollama pull hermes3:8b || true

            # Build and start dialog-gen
            docker compose build dialog-gen --no-cache
            docker compose up -d dialog-gen
            sleep 5
            echo "=== Container Status ==="
            docker compose ps dialog-gen ollama
            echo "=== Recent Logs ==="
            docker compose logs dialog-gen --tail=20

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Clone repo if not exists
            if [ ! -d /opt/tg/dialog-gen ]; then
              cd /opt/tg && git clone https://github.com/mikrowelt/dialog-gen.git
            else
              cd /opt/tg/dialog-gen && git fetch origin && git checkout main && git pull origin main
            fi

            # Ensure Ollama is running and has the model
            cd /opt/tg/tg-deploy
            docker compose up -d ollama
            sleep 5
            docker compose exec -T ollama ollama pull hermes3:8b || true

            # Build and start dialog-gen
            docker compose build dialog-gen --no-cache
            docker compose up -d dialog-gen
            sleep 5
            docker compose ps dialog-gen ollama
            docker compose logs dialog-gen --tail=20
