name: Deploy

on:
  push:
    branches:
      - main
      - stage
      - dev
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Build and push on build server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BUILD_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          script: |
            /opt/ca-build/build-and-push.sh dialog-gen ${{ github.ref_name }}

  deploy-dev:
    needs: build-and-push
    if: github.ref == 'refs/heads/dev'
    runs-on: self-hosted
    steps:
      - name: Deploy to dev server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            cd /opt/ca
            echo "$GHCR_TOKEN" | docker login ghcr.io -u mikrowelt --password-stdin
            docker pull ghcr.io/mikrowelt/dialog-gen:dev
            docker compose up -d dialog-gen

            sleep 5
            echo "=== Container Status ==="
            docker compose ps dialog-gen
            echo "=== Recent Logs ==="
            docker compose logs dialog-gen --tail=20
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  deploy-staging:
    needs: build-and-push
    if: github.ref == 'refs/heads/stage'
    runs-on: self-hosted
    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            cd /opt/ca
            echo "$GHCR_TOKEN" | docker login ghcr.io -u mikrowelt --password-stdin
            docker pull ghcr.io/mikrowelt/dialog-gen:stage
            docker compose up -d dialog-gen

            sleep 5
            echo "=== Container Status ==="
            docker compose ps dialog-gen
            echo "=== Recent Logs ==="
            docker compose logs dialog-gen --tail=20
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  deploy-production:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            cd /opt/ca
            echo "$GHCR_TOKEN" | docker login ghcr.io -u mikrowelt --password-stdin
            docker pull ghcr.io/mikrowelt/dialog-gen:main
            docker compose up -d dialog-gen

            sleep 5
            echo "=== Container Status ==="
            docker compose ps dialog-gen
            echo "=== Recent Logs ==="
            docker compose logs dialog-gen --tail=20
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
